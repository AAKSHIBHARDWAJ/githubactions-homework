name: 'Build, Push and Scan'
description: 'Builds Docker image, pushes to GHCR, and scans with Trivy'

inputs:
  image_name:
    description: 'Name of the Docker image'
    required: true
  tag:
    description: 'Tag for the Docker image'
    required: true
  dockerfile:
    description: 'Path to Dockerfile'
    required: false
    default: 'Dockerfile'
  context:
    description: 'Build context path'
    required: false
    default: '.'
  build_args:
    description: 'Build arguments'
    required: false
    default: ''

outputs:
  image_uri:
    description: 'Full URI of the pushed image'
    value: ${{ steps.prep.outputs.image_uri }}

runs:
  using: 'composite'
  steps:
    - name: Prepare lowercase image URI
      id: prep
      shell: bash
      run: |
        REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        URI="ghcr.io/${REPO_LOWER}/${{ inputs.image_name }}:${{ inputs.tag }}"
        echo "image_uri=${URI}" >> $GITHUB_OUTPUT
        echo "IMAGE_URI=${URI}" >> $GITHUB_ENV

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ env.IMAGE_URI }}

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.IMAGE_URI }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
